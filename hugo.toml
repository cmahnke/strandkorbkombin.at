baseURL = 'https://strandkorbkombin.at/'
locale = 'de-DE'
defaultContentLanguage = 'de'
title = 'Strandkorb-Kombinat'
theme = 'projektemacher-base'
publishDir = 'docs'
enableRobotsTXT = true

[markup.goldmark.renderer]
  unsafe = true

[outputs]
  home = ['html', 'rss']
  section = ['html', 'rss']
  taxonomy = ['html', 'rss']
  term = ['html', 'rss']

[params.webmentions]
  # Webmention/pingback endpoint (collected by the projektemacher webmention
  # service). Received mentions live in 'data/webmentions/mentions.json'
  endpoint = 'https://static.projektemacher.org/services/webmentions/webmention.php'
  advertisePingback = true

[security]
  allowContent = ['^text/html$', '^text/markdown$']

  [security.http]
    mediaTypes = ['^application/json$',
                  '^application/json;\s?charset=[uU][tT][fF]-8$',
                  '^application/ld\+json;charset=[uU][tT][fF]-8$',
                  '^application/ld\+json(;.*)?$',
                  '^application/sparql-results\+json;\s?charset=[uU][tT][fF]-8$',
                  '^application/sparql-results\+json$']
    urls = ['^https://unpkg\.com/.*', '^https://aframe.io\/.*', '^https://www\.wikidata\.org/.*', '^https://query\.wikidata\.org/.*', '^https://(de|en)\.wikipedia\.org/.*', '^https?://vocab\.getty\.edu/.*', '^https?://data\.getty\.edu/vocab/.*', '^https://qlever\.dev/api/.*', '^https://static\.projektemacher\.org/.*', '^https://christianmahnke\.de/.*']
