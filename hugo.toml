baseURL = 'https://strandkorbkombin.at/'
locale = 'de-DE'
defaultContentLanguage = 'de'
title = 'Strandkorb-Kombinat'
theme = 'projektemacher-base'
publishDir = 'docs'

[markup.goldmark.renderer]
  unsafe = true

[outputs]
  home = ['html', 'rss']
  section = ['html', 'rss']
  taxonomy = ['html', 'rss']
  term = ['html', 'rss']

[params.webmentions]
  # Webmention/pingback endpoint (collected by the projektemacher webmention
  # service). Received mentions live in 'data/webmentions/mentions.json'
  endpoint = 'https://static.projektemacher.org/services/webmentions/webmention.php'
  advertisePingback = true

